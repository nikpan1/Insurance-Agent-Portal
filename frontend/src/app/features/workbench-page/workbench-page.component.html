<main class="workbench-page container py-4 py-lg-5">
  <header class="mb-4">
    <h1 class="h3 mb-1">Operations Workbench</h1>
    <p class="text-body-secondary mb-0">Single-page demo for client, external insurance, and reference operations.</p>
  </header>

  <section class="card border-0 shadow-sm mb-4">
    <div class="card-body p-3 p-md-4">
      <h2 class="h6 mb-3">Request Context</h2>
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-4 col-xl-3">
          <label for="currentUserId" class="form-label">Current User ID</label>
          <input
            id="currentUserId"
            type="number"
            class="form-control"
            [formControl]="currentUserIdControl"
            min="1"
            step="1"
          />
          @if (currentUserIdControl.invalid && (currentUserIdControl.dirty || currentUserIdControl.touched)) {
            <div class="invalid-feedback d-block">Enter a positive numeric user id.</div>
          }
        </div>
      </div>
    </div>
  </section>

  <section class="row g-4">
    <div class="col-12 col-xl-6">
      <app-context-client-flow [userId]="currentUserId" />
    </div>
    <div class="col-12 col-xl-6">
      <app-external-insurance-flow [userId]="currentUserId" (auditRefreshRequested)="refreshAuditForCurrentUser()" />
    </div>
    <div class="col-12">
      <app-system-reference-flow />
    </div>
  </section>
</main>
