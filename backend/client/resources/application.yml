spring:
  application:
    name: polictracker-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    mongodb:
      uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB}?authSource=admin

external-insurance:
  base-url: ${EXTERNAL_INSURANCE_BASE_URL:https://api.external-insurance.com/v1}

reference-data-import:
  csv:
    default-source-path: ${REFERENCE_DATA_IMPORT_CSV_PATH:./data/reference-data.csv}

system-properties:
  defaults:
    externalinsurance-events-enabled: ${SYSTEM_PROPERTIES_EXTERNAL_EVENTS_ENABLED:true}
